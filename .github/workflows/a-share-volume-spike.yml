name: A-share volume spike report

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/a-share-volume-spike.yml"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional report date in YYYYMMDD, defaults to today in Asia/Shanghai"
        required: false
        type: string
      recipient_email:
        description: "Report recipient email"
        required: false
        type: string
        default: "hfutzhanghb@163.com"
  schedule:
    # 17:30 Asia/Shanghai, Monday-Friday. GitHub cron is UTC.
    - cron: "30 9 * * 1-5"

concurrency:
  group: a-share-volume-spike-report
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      REPORT_DATE_INPUT: ${{ github.event.inputs.as_of || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run volume spike screener
        run: |
          set -euo pipefail
          mkdir -p reports
          REPORT_DATE="$REPORT_DATE_INPUT"
          if [ -z "$REPORT_DATE" ]; then
            REPORT_DATE="$(date +%Y%m%d)"
          fi
          OUTPUT="reports/a_share_volume_spike_${REPORT_DATE}.csv"

          python -m share_analytics.cli \
            --screen \
            --as-of "$REPORT_DATE" \
            --min-market-cap-yi 0 \
            --volume-multiple 2 \
            --include-all-industries \
            --request-pause-seconds 1.5 \
            --spot-source sina \
            --daily-source tencent \
            --limit 200 \
            --output "$OUTPUT" | tee reports/a_share_volume_spike_${REPORT_DATE}.log

          {
            echo "## A-share volume spike report ${REPORT_DATE}"
            echo
            echo "- Criteria: current trading-day volume >= 2x previous trading-day volume"
            echo "- Sources: Sina spot snapshot, Tencent daily bars through AkShare"
            echo "- Candidate reduction: THS volume-expansion prefilter, then daily-bar verification"
            echo "- Throttle: one external request at least every 1.5 seconds"
            echo
            echo '```text'
            cat reports/a_share_volume_spike_${REPORT_DATE}.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Email report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || vars.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM || vars.SMTP_FROM }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email || vars.RECIPIENT_EMAIL || 'hfutzhanghb@163.com' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          from email.message import EmailMessage
          from html import escape
          from pathlib import Path
          import mimetypes
          import os
          import smtplib
          import ssl

          required = ["SMTP_HOST", "SMTP_USERNAME", "SMTP_PASSWORD"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required SMTP secrets: {', '.join(missing)}")

          report_files = sorted(Path("reports").glob("a_share_volume_spike_*.csv"))
          log_files = sorted(Path("reports").glob("a_share_volume_spike_*.log"))
          if not report_files:
              raise SystemExit("No CSV report found under reports/.")

          report_path = report_files[-1]
          log_path = log_files[-1] if log_files else None
          report_date = report_path.stem.removeprefix("a_share_volume_spike_")
          sender = os.environ.get("SMTP_FROM") or os.environ["SMTP_USERNAME"]
          recipient = os.environ["RECIPIENT_EMAIL"]
          port = int(os.environ.get("SMTP_PORT") or "465")
          rows = list(csv.DictReader(report_path.open(encoding="utf-8")))

          columns = [
              ("symbol", "代码"),
              ("name", "公司名称"),
              ("industry", "行业"),
              ("latest_price", "股价"),
              ("previous_volume", "上一交易日成交量"),
              ("current_volume", "当日成交量"),
              ("volume_ratio", "倍数"),
              ("trade_date", "交易日"),
              ("previous_trade_date", "上一交易日"),
          ]

          def format_value(column: str, value: str) -> str:
              if value is None or value == "":
                  return ""
              if column in {"latest_price", "volume_ratio"}:
                  return f"{float(value):.2f}"
              if column in {"previous_volume", "current_volume"}:
                  return f"{float(value):,.0f}"
              if column in {"trade_date", "previous_trade_date"}:
                  return value.split()[0]
              return value

          def markdown_table(max_rows: int = 50) -> str:
              header = "| " + " | ".join(label for _, label in columns) + " |"
              separator = "| " + " | ".join("---" for _ in columns) + " |"
              body = [
                  "| "
                  + " | ".join(format_value(column, row.get(column, "")) for column, _ in columns)
                  + " |"
                  for row in rows[:max_rows]
              ]
              if len(rows) > max_rows:
                  body.append(f"| ... | 共 {len(rows)} 条，正文仅展示前 {max_rows} 条，其余见附件 |  |  |  |  |  |  |  |")
              return "\n".join([header, separator, *body])

          def html_table() -> str:
              table_head = "".join(
                  f"<th>{escape(label)}</th>" for _, label in columns
              )
              table_rows = []
              for row in rows:
                  cells = "".join(
                      f"<td>{escape(format_value(column, row.get(column, '')))}</td>"
                      for column, _ in columns
                  )
                  table_rows.append(f"<tr>{cells}</tr>")
              if not table_rows:
                  table_rows.append(
                      f"<tr><td colspan=\"{len(columns)}\">No matching stocks.</td></tr>"
                  )
              return f"<table><thead><tr>{table_head}</tr></thead><tbody>{''.join(table_rows)}</tbody></table>"

          message = EmailMessage()
          message["Subject"] = f"A-share volume spike report {report_date}"
          message["From"] = sender
          message["To"] = recipient
          message.set_content(
              "\n".join(
                  [
                      f"A-share volume spike report for {report_date}.",
                      "",
                      "Criteria: current trading-day volume >= 2x previous trading-day volume.",
                      f"Selected: {len(rows)}",
                      "",
                      markdown_table(),
                      "",
                      "CSV and log files are attached.",
                  ]
              )
          )
          message.add_alternative(
              f"""\
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <style>
                body {{
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  color: #17202a;
                  line-height: 1.45;
                }}
                table {{
                  border-collapse: collapse;
                  width: 100%;
                  margin-top: 16px;
                  font-size: 13px;
                }}
                th, td {{
                  border: 1px solid #d6dde5;
                  padding: 8px 10px;
                  text-align: right;
                  white-space: nowrap;
                }}
                th {{
                  background: #eef3f8;
                  color: #0f172a;
                  font-weight: 600;
                }}
                td:nth-child(2), td:nth-child(3),
                th:nth-child(2), th:nth-child(3) {{
                  text-align: left;
                }}
                .summary {{
                  margin: 0 0 12px;
                  color: #334155;
                }}
              </style>
            </head>
            <body>
              <h2>A-share volume spike report {escape(report_date)}</h2>
              <p class="summary">Criteria: current trading-day volume &gt;= 2x previous trading-day volume.</p>
              <p class="summary">Selected: {len(rows)}. CSV and log files are attached.</p>
              {html_table()}
            </body>
          </html>
          """,
              subtype="html",
          )

          for path in [report_path, log_path]:
              if path is None:
                  continue
              content_type, _ = mimetypes.guess_type(path.name)
              maintype, subtype = (content_type or "application/octet-stream").split("/", 1)
              message.add_attachment(
                  path.read_bytes(),
                  maintype=maintype,
                  subtype=subtype,
                  filename=path.name,
              )

          if port == 465:
              with smtplib.SMTP_SSL(os.environ["SMTP_HOST"], port, context=ssl.create_default_context()) as smtp:
                  smtp.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
                  smtp.send_message(message)
          else:
              with smtplib.SMTP(os.environ["SMTP_HOST"], port) as smtp:
                  smtp.starttls(context=ssl.create_default_context())
                  smtp.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
                  smtp.send_message(message)
          PY

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-volume-spike-report
          path: reports/
          retention-days: 30
